# Pipeline-side services. The mission tracking DB, MLflow, Metabase and Label Studio
# live in the subdron_missions_database compose project (same host); the runners reach
# its Postgres at host.docker.internal:5432 with the credentials the setup script
# stores in DATA_ROOT/_state/mission_db.env.
services:
  # Always-on anomaly scoring API (CPU). Image: scripts/update_local_images.sh
  anomaly-api:
    image: subdron-anomaly-api:${ANOMALY_API_VERSION:-dev}
    container_name: subdron-anomaly-api
    restart: unless-stopped
    ports:
      - "${ANOMALY_API_PORT:-8095}:8080"
    environment:
      LOCAL_CACHE_BASE: /models
      TRUST_REMOTE_CODE: "1"
    volumes:
      - ${DATA_ROOT:-/srv/subdron/data}/_state/models/anomaly:/models   # <model>/model.xml + model.bin
