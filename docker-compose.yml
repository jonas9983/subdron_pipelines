services:
  image-processing:
    build:
      context: ./image-processing
      dockerfile: Dockerfile
    image: image-processing 
    runtime: nvidia
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    volumes:
      - ./data:/image-processing/images

  colmap:
    build:
      context: ./colmap
      dockerfile: docker/Dockerfile
      args:
        UBUNTU_VERSION: "24.04"
        NVIDIA_CUDA_VERSION: "12.8.0"
    image: colmap
    depends_on:
      - image-processing
    volumes:
      - "./data:/colmap/projects"
    runtime: nvidia
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]